<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pakkeliv – netthandelsimulator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="phone">
  <div id="statusbar" onclick="OS.toggleShade()">
    <span id="sb-time">08:00</span>
    <span id="sb-icons"><span id="sb-notif"></span> 📶 <span class="batt"><span id="sb-batt" style="width:80%"></span></span></span>
  </div>
  <div id="screen">
    <div id="home"></div>
    <div id="appview" class="hidden"></div>
  </div>
  <div id="navbar">
    <button onclick="OS.back()" aria-label="Tilbake">◁</button>
    <button onclick="OS.home()" aria-label="Hjem">○</button>
    <button onclick="OS.toggleShade()" aria-label="Varsler">▢</button>
  </div>
  <div id="banner" class="hidden"></div>
  <div id="shade" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<script src="js/util.js"></script>
<script src="js/products.js"></script>
<script src="js/game.js"></script>
<script src="js/os.js"></script>
<script src="js/apps/shop.js"></script>
<script src="js/apps/post.js"></script>
<script src="js/apps/mail.js"></script>
<script src="js/apps/bank.js"></script>
<script src="js/apps/misc.js"></script>
<script src="js/apps/missions.js"></script>
<script>OS.boot();</script>
</body>
</html>
